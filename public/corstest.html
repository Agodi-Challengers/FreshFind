<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
  </head>
  <body>
    <pre id="log"></pre>
    <script>
      const log = (m) => {
        document.getElementById("log").textContent += m + "\n";
      };
      const U =
        "https://embed.tawk.to/6ab7ed0e004d41343f7da325/1k3f7c0a6?cb=" +
        Date.now();
      const s = document.createElement("script");
      s.async = true;
      s.charset = "UTF-8";
      s.src = U;
      s.onload = () => {
        log("PLAIN SCRIPT: LOADED");
      };
      s.onerror = () => {
        log("PLAIN SCRIPT: ERROR");
      };
      document.head.appendChild(s);
      setTimeout(() => {
        log("typeof window.$_Tawk = " + typeof window.$_Tawk);
        log("typeof window.Tawk_API = " + typeof window.Tawk_API);
        log("iframes = " + document.querySelectorAll("iframe").length);
        log(
          "scripts = " +
            Array.from(document.scripts)
              .map((x) => x.src)
              .filter(Boolean)
              .join(" | "),
        );
        document.title = "done";
      }, 5000);
    </script>
  </body>
</html>
